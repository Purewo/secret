[project]
name = "agent-vault"
version = "0.3.0"
description = "A small local encrypted vault for agent-safe secret usage."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=43.0.0",
    "filelock>=3.15.0",
    "keyring>=25.0.0",
    "platformdirs>=4.2.0",
]

[project.scripts]
agent-vault = "agent_vault.cli:main"
agent-vault-web = "agent_vault.web:main"
agent-vault-client = "agent_vault.client:main"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
